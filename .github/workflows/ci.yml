name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test Java service
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify

  ai-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        working-directory: ai-worker
        run: pip install -e '.[test]'
      - name: Test and lint
        working-directory: ai-worker
        run: |
          pytest
          ruff check app tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install and build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

  deployment-config:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-placeholder-not-a-secret
      REDIS_PASSWORD: ci-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v5
      - name: Validate Docker Compose topology
        run: docker compose config --quiet
      - name: Render Kubernetes Kustomize baseline
        run: kubectl kustomize deploy/k8s/base > /tmp/ies-kubernetes.yaml
      - name: Build API container image
        run: docker build --tag ies-api:ci ./backend
      - name: Build web container image
        run: docker build --tag ies-web:ci ./frontend
      - name: Build AI-worker container image
        run: docker build --tag ies-ai-worker:ci ./ai-worker
