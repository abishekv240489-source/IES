name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Verify Node microservices and PostgreSQL migrations
        working-directory: backend
        run: |
          pnpm install --frozen-lockfile
          pnpm verify

  ai-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        working-directory: ai-worker
        run: pip install -e '.[test]' -r ../evaluation/requirements.txt
      - name: Test and lint
        working-directory: ai-worker
        run: |
          cd ..
          python -m pytest ai-worker/tests evaluation/tests
          ruff check ai-worker/app ai-worker/tests evaluation
          python evaluation/generate_synthetic.py --output-root /tmp/ies-synthetic --count 3
          python evaluation/evaluate.py --truth /tmp/ies-synthetic/ground_truth --predictions /tmp/ies-predictions --report-only

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install and build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

  deployment-config:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v5
      - name: Validate Docker Compose topology
        run: docker compose config --quiet
      - name: Render Kubernetes Kustomize baseline
        run: kubectl kustomize deploy/k8s/base > /tmp/ies-kubernetes.yaml
      - name: Build API container image
        run: docker build --target api --tag ies-api:ci ./backend
      - name: Build processor container image
        run: docker build --target processor --tag ies-processor:ci ./backend
      - name: Build web container image
        run: docker build --tag ies-web:ci ./frontend
      - name: Build AI-worker container image
        run: docker build --tag ies-ai-worker:ci ./ai-worker
