name: ies-local

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ies}
      POSTGRES_USER: ${POSTGRES_USER:-ies_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["ies-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  ollama:
    image: ollama/ollama:0.11.4
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ies-ollama:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  ollama-model:
    image: ollama/ollama:0.11.4
    profiles: ["models"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:7b-instruct-q4_K_M}"]
    depends_on:
      ollama:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]

  ai-worker:
    build:
      context: ./ai-worker
    image: ies-ai-worker:local
    restart: unless-stopped
    environment:
      IES_MAPPING_PROVIDER: ${IES_MAPPING_PROVIDER:-ollama}
      IES_AI_DEMO_FALLBACK: ${IES_AI_DEMO_FALLBACK:-true}
      IES_MIN_FIELD_CONFIDENCE: ${IES_MIN_FIELD_CONFIDENCE:-0.70}
      IES_MAX_FILE_BYTES: ${IES_MAX_FILE_BYTES:-20971520}
      IES_MAX_PAGES: ${IES_MAX_PAGES:-20}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct-q4_K_M}
      PADDLEOCR_LANG: ${PADDLEOCR_LANG:-en}
      PADDLEOCR_ENABLE_MKLDNN: ${PADDLEOCR_ENABLE_MKLDNN:-true}
      PADDLE_PDX_CACHE_HOME: /home/ies/.paddlex
      PADDLEOCR_DETECTION_MODEL: ${PADDLEOCR_DETECTION_MODEL:-PP-OCRv5_mobile_det}
      PADDLEOCR_RECOGNITION_MODEL: ${PADDLEOCR_RECOGNITION_MODEL:-en_PP-OCRv5_mobile_rec}
      PADDLEOCR_RECOGNITION_BATCH_SIZE: ${PADDLEOCR_RECOGNITION_BATCH_SIZE:-16}
      PADDLEOCR_DETECTION_LIMIT_SIDE: ${PADDLEOCR_DETECTION_LIMIT_SIDE:-1280}
      PADDLEOCR_DETECTION_LIMIT_TYPE: ${PADDLEOCR_DETECTION_LIMIT_TYPE:-max}
      PADDLEOCR_USE_ORIENTATION: ${PADDLEOCR_USE_ORIENTATION:-false}
      PADDLEOCR_USE_UNWARPING: ${PADDLEOCR_USE_UNWARPING:-false}
      PADDLEOCR_USE_TEXTLINE_ORIENTATION: ${PADDLEOCR_USE_TEXTLINE_ORIENTATION:-false}
    ports: ["127.0.0.1:8090:8090"]
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4g
    volumes: ["ies-paddle-cache:/home/ies"]
    read_only: true
    tmpfs: ["/tmp:size=1g,mode=1777"]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: ./backend
      target: api
    image: ies-api:local
    restart: unless-stopped
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-ies}
      DATABASE_USERNAME: ${POSTGRES_USER:-ies_app}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      IES_STORAGE_ROOT: /var/lib/ies/invoices
      IES_ALLOWED_ORIGINS: ${IES_ALLOWED_ORIGINS:-http://localhost:8088}
      IES_AUTH_ENABLED: ${IES_AUTH_ENABLED:-false}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-}
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["ies-invoices:/var/lib/ies/invoices"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/actuator/health/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512m
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    security_opt: ["no-new-privileges:true"]

  processor:
    build:
      context: ./backend
      target: processor
    image: ies-processor:local
    restart: unless-stopped
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-ies}
      DATABASE_USERNAME: ${POSTGRES_USER:-ies_app}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      IES_STORAGE_ROOT: /var/lib/ies/invoices
      IES_AI_WORKER_URL: http://ai-worker:8090
      IES_MIN_FIELD_CONFIDENCE: ${IES_MIN_FIELD_CONFIDENCE:-0.70}
      IES_PROCESSOR_CONCURRENCY: ${IES_PROCESSOR_CONCURRENCY:-4}
      IES_PROCESSOR_POLL_MS: ${IES_PROCESSOR_POLL_MS:-500}
    ports: ["127.0.0.1:8081:8081"]
    volumes: ["ies-invoices:/var/lib/ies/invoices"]
    depends_on:
      postgres:
        condition: service_healthy
      ai-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512m
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: ./frontend
    image: ies-web:local
    restart: unless-stopped
    ports: ["127.0.0.1:8088:8080"]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,uid=101,gid=101
    security_opt: ["no-new-privileges:true"]

volumes:
  ies-postgres:
  ies-ollama:
  ies-paddle-cache:
  ies-invoices:
