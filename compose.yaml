name: ies-local

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ies}
      POSTGRES_USER: ${POSTGRES_USER:-ies_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["ies-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["ies-redis:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports: ["127.0.0.1:9092:9092"]
    volumes: ["ies-kafka:/var/lib/kafka/data"]
    security_opt: ["no-new-privileges:true"]

  ollama:
    image: ollama/ollama:0.11.4
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ies-ollama:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  ollama-model:
    image: ollama/ollama:0.11.4
    profiles: ["models"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:7b-instruct-q4_K_M}"]
    depends_on:
      ollama:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]

  ai-worker:
    build:
      context: ./ai-worker
    image: ies-ai-worker:local
    restart: unless-stopped
    environment:
      IES_MAPPING_PROVIDER: ${IES_MAPPING_PROVIDER:-ollama}
      IES_AI_DEMO_FALLBACK: ${IES_AI_DEMO_FALLBACK:-true}
      IES_MIN_FIELD_CONFIDENCE: ${IES_MIN_FIELD_CONFIDENCE:-0.70}
      IES_MAX_FILE_BYTES: ${IES_MAX_FILE_BYTES:-20971520}
      IES_MAX_PAGES: ${IES_MAX_PAGES:-20}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct-q4_K_M}
      PADDLEOCR_LANG: ${PADDLEOCR_LANG:-en}
    ports: ["127.0.0.1:8090:8090"]
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4g
    volumes: ["ies-paddle-cache:/home/ies"]
    read_only: true
    tmpfs: ["/tmp:size=1g,mode=1777"]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: ./backend
    image: ies-api:local
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ies}
      DATABASE_USERNAME: ${POSTGRES_USER:-ies_app}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      IES_STORAGE_ROOT: /var/lib/ies/invoices
      IES_AI_WORKER_URL: http://ai-worker:8090
      IES_AI_DEMO_FALLBACK: ${IES_AI_DEMO_FALLBACK:-true}
      IES_ALLOWED_ORIGINS: ${IES_ALLOWED_ORIGINS:-http://localhost:8088}
      IES_AUTH_ENABLED: ${IES_AUTH_ENABLED:-false}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-}
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["ies-invoices:/var/lib/ies/invoices"]
    depends_on:
      postgres:
        condition: service_healthy
      ai-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 1g
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: ./frontend
    image: ies-web:local
    restart: unless-stopped
    ports: ["127.0.0.1:8088:8080"]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,uid=101,gid=101
    security_opt: ["no-new-privileges:true"]

volumes:
  ies-postgres:
  ies-redis:
  ies-kafka:
  ies-ollama:
  ies-paddle-cache:
  ies-invoices:
