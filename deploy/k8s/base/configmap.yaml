apiVersion: v1
kind: ConfigMap
metadata:
  name: ies-runtime-config
data:
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: ies
  DATABASE_USERNAME: ies_app
  IES_STORAGE_ROOT: /var/lib/ies/invoices
  IES_AI_WORKER_URL: http://ai-worker:8090
  IES_AI_DEMO_FALLBACK: "false"
  IES_ALLOWED_ORIGINS: https://ies.example.com
  IES_AUTH_ENABLED: "true"
  JWT_ISSUER_URI: https://login.microsoftonline.com/REPLACE_TENANT_ID/v2.0
  IES_MAPPING_PROVIDER: ollama
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: qwen2.5:7b-instruct-q4_K_M
  IES_MIN_FIELD_CONFIDENCE: "0.70"
  IES_MAX_FILE_BYTES: "20971520"
  IES_MAX_PAGES: "20"
  IES_PROCESSOR_CONCURRENCY: "1"
  IES_AI_TIMEOUT_MS: "900000"
  IES_PROCESSOR_LEASE_SECONDS: "1020"
  IES_LLM_TIMEOUT_SECONDS: "300"
  IES_HYBRID_FAST_PATH: "true"
  IES_PROCESSOR_POLL_MS: "500"
  PADDLEOCR_LANG: en
  PADDLEOCR_ENABLE_MKLDNN: "true"
  PADDLE_PDX_CACHE_HOME: /home/ies/.paddlex
  PADDLEOCR_DETECTION_MODEL: PP-OCRv5_mobile_det
  PADDLEOCR_RECOGNITION_MODEL: en_PP-OCRv5_mobile_rec
  PADDLEOCR_RECOGNITION_BATCH_SIZE: "16"
  PADDLEOCR_DETECTION_LIMIT_SIDE: "1280"
  PADDLEOCR_DETECTION_LIMIT_TYPE: max
  PADDLEOCR_USE_ORIENTATION: "false"
  PADDLEOCR_USE_UNWARPING: "false"
  PADDLEOCR_USE_TEXTLINE_ORIENTATION: "false"
