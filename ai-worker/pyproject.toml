[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ies-ai-worker"
version = "0.1.0"
description = "PaddleOCR and Qwen extraction worker for IES"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
  "PyMuPDF>=1.26,<2",
  "Pillow>=11,<12",
  "numpy>=2.0,<3"
]

[project.optional-dependencies]
ocr = [
  "paddleocr>=3.3,<4",
  # Paddle 3.3.x has a Windows/Linux CPU OneDNN PIR regression. Keep the
  # verified accelerated runtime until the upstream fix is released.
  "paddlepaddle==3.2.2",
  "opencv-python-headless>=4.11,<5"
]
test = ["pytest>=8.4,<9", "pytest-cov>=6,<7", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
